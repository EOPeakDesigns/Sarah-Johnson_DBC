<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     viewBox="0 0 1024 1024" 
     width="1024" 
     height="1024"
     role="img"
     aria-label="Sarah Johnson Professional Logo - Initials SJ">
  <!-- 
    Large Format Favicon/Logo for QR Code Embedding
    Project: EOPeak Corporate Design
    Author: Eng. Eslam Osama Saad
    Purpose: High-resolution version of brand logo for QR code center integration
    Dimensions: 1024x1024 pixels (scalable for any size)
    Design: Gold background with white initials "SJ"
  -->
  
  <!-- Gold background rectangle with rounded corners -->
  <!-- Border radius: 12% of width (proportional to original 12/100) -->
  <rect width="1024" 
        height="1024" 
        fill="#C9A25D" 
        rx="122.88" 
        ry="122.88"/>
  
  <!-- White initials "SJ" text -->
  <!-- Font size: ~430px (proportional to original 42px scaled by 1024/100) -->
  <!-- Positioned at center (512, 512) -->
  <text x="512" 
        y="512" 
        font-family="sans-serif" 
        font-size="430" 
        font-weight="700" 
        fill="#FFFFFF" 
        text-anchor="middle" 
        dominant-baseline="central"
        letter-spacing="0">
    SJ
  </text>
</svg>

